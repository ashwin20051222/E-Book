<script>
  let selectedTone = 'Terracotta';

  function selectSwatch(button, toneName) {
    selectedTone = toneName;
    const allButtons = document.querySelectorAll('#swatch-group .swatch-btn');
    allButtons.forEach(btn => {
      btn.setAttribute('aria-checked', 'false');
      btn.classList.remove('ring-2', 'ring-offset-2', 'ring-primary');
      const icon = btn.querySelector('.swatch-check');
      if (icon) icon.classList.add('hidden');
    });

    button.setAttribute('aria-checked', 'true');
    const activeIcon = button.querySelector('.swatch-check');
    if (activeIcon) activeIcon.classList.remove('hidden');
  }

  function updateCount() {
    const checkboxes = document.querySelectorAll('.book-checkbox');
    const checked = Array.from(checkboxes).filter(cb => cb.checked).length;
    
    document.getElementById('count-display').textContent = checked;
    const btnLabel = document.getElementById('submit-btn-label');
    if (checked === 0) {
      btnLabel.textContent = 'Create empty shelf';
    } else if (checked === 1) {
      btnLabel.textContent = 'Create shelf (1 book)';
    } else {
      btnLabel.textContent = `Create shelf (${checked} books)`;
    }

    const selectAllBtn = document.getElementById('select-all-btn');
    if (selectAllBtn) {
      selectAllBtn.textContent = checked === checkboxes.length ? 'Deselect all' : 'Select all';
    }
  }

  function toggleBookCheck(checkbox) {
    const row = checkbox.closest('.book-row');
    if (checkbox.checked) {
      row.classList.remove('bg-surface-container-lowest');
      row.classList.add('bg-surface-container-low/70');
    } else {
      row.classList.remove('bg-surface-container-low/70');
      row.classList.add('bg-surface-container-lowest');
    }
    updateCount();
  }

  function selectAllBooks(btn) {
    const checkboxes = document.querySelectorAll('.book-checkbox');
    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
    checkboxes.forEach(cb => {
      cb.checked = !allChecked;
      toggleBookCheck(cb);
    });
  }

  function filterBooks(query) {
    const term = query.toLowerCase().trim();
    const rows = document.querySelectorAll('.book-row');
    rows.forEach(row => {
      const text = row.textContent.toLowerCase();
      row.style.display = text.includes(term) ? 'flex' : 'none';
    });
  }

  function createShelfAction() {
    const nameInput = document.getElementById('shelf-title-input');
    const shelfName = nameInput.value.trim() || 'Untitled Shelf';
    const count = Array.from(document.querySelectorAll('.book-checkbox')).filter(cb => cb.checked).length;
    
    const submitBtn = document.getElementById('submit-shelf-btn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = `
      <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
      <span>Binding shelf...</span>
    `;

    setTimeout(() => {
      history.back();
    }, 450);
  }
</script></main></body></html>
