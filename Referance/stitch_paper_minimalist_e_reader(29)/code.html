<script>
  (function() {
    const checkboxes = document.querySelectorAll('.shelf-checkbox');
    const countIndicator = document.getElementById('shelf-count-indicator');
    const createBtn = document.getElementById('btn-create-shelf');
    const inputContainer = document.getElementById('new-shelf-input-container');
    const inputField = document.getElementById('new-shelf-name');
    const confirmBtn = document.getElementById('btn-confirm-new-shelf');
    const doneBtn = document.getElementById('btn-save-shelves');

    function updateCount() {
      const activeCount = document.querySelectorAll('.shelf-checkbox:checked').length;
      if (countIndicator) {
        countIndicator.textContent = activeCount === 1 ? '1 selected' : activeCount + ' selected';
      }
    }

    checkboxes.forEach(cb => {
      cb.addEventListener('change', updateCount);
    });

    if (createBtn && inputContainer && inputField) {
      createBtn.addEventListener('click', () => {
        inputContainer.classList.toggle('hidden');
        if (!inputContainer.classList.contains('hidden')) {
          inputField.focus();
        }
      });
    }

    if (confirmBtn && inputField) {
      confirmBtn.addEventListener('click', () => {
        const val = inputField.value.trim();
        if (val) {
          inputContainer.classList.add('hidden');
          inputField.value = '';
          if (countIndicator) {
            countIndicator.textContent = (document.querySelectorAll('.shelf-checkbox:checked').length + 1) + ' selected';
          }
        }
      });
    }

    if (doneBtn) {
      doneBtn.addEventListener('click', () => {
        const sheet = document.getElementById('shelf-bottom-sheet');
        if (sheet) {
          sheet.style.transform = 'translateY(100%)';
          setTimeout(() => {
            if (window.history && window.history.length > 1) {
              window.history.back();
            }
          }, 240);
        }
      });
    }
  })();
</script></main></body></html>
