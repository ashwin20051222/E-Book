<!DOCTYPE html>

<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-surface-variant": "#4a463f", "surface-tint": "#615e5a", "inverse-primary": "#cbc6c1", "tertiary-container": "#241c17", "surface-variant": "#e4e2de", "error": "#ba1a1a", "primary": "#040302", "on-tertiary-fixed-variant": "#4f453e", "on-primary": "#ffffff", "surface-bright": "#fbf9f5", "on-surface": "#1b1c1a", "on-background": "#1b1c1a", "surface-container-low": "#f5f3ef", "on-primary-fixed": "#1d1b18", "on-tertiary-container": "#90837b", "on-error": "#ffffff", "on-secondary-container": "#752402", "on-secondary": "#ffffff", "surface-dim": "#dbdad6", "outline-variant": "#cdc5bc", "secondary-fixed-dim": "#ffb59c", "inverse-surface": "#30312e", "on-error-container": "#93000a", "tertiary": "#070301", "on-tertiary-fixed": "#221a15", "on-secondary-fixed": "#380c00", "background": "#fbf9f5", "surface": "#fbf9f5", "on-secondary-fixed-variant": "#7f2b08", "surface-container": "#efeeea", "tertiary-fixed-dim": "#d3c3bb", "surface-container-high": "#eae8e4", "primary-fixed": "#e7e1dc", "surface-container-lowest": "#ffffff", "primary-container": "#1f1d1a", "primary-fixed-dim": "#cbc6c1", "on-primary-container": "#898580", "inverse-on-surface": "#f2f0ed", "outline": "#7c766e", "secondary-fixed": "#ffdbcf", "on-tertiary": "#ffffff", "secondary": "#9e421e", "surface-container-highest": "#e4e2de", "error-container": "#ffdad6", "secondary-container": "#ff8c62", "tertiary-fixed": "#f0dfd6", "on-primary-fixed-variant": "#494643" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: {}, fontFamily: { headline: ["Literata"], display: ["Literata"], body: ["Literata"], label: ["Inter"] }, fontSize: {} } } }</style><style>@layer base { html, body { min-height: 100%; margin: 0; padding: 0; } body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-background font-body text-on-surface antialiased flex flex-col min-h-screen selection:bg-secondary-fixed selection:text-on-secondary-fixed"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-background"><div class="flex flex-col w-full px-4 pb-10">
  <!-- Search Header Bar -->
  <div class="flex items-center gap-3 pt-2 pb-4 sticky top-0 bg-background z-20">
    <div class="relative flex-1 flex items-center">
      <span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant pointer-events-none text-[20px]" style="font-variation-settings: 'wght' 300;">search</span>
      <input
        id="search-input"
        type="search"
        value="stoic"
        placeholder="Search books, passages, notes..."
        class="w-full h-12 pl-10 pr-9 bg-surface-container-lowest text-on-surface font-label text-[15px] rounded-lg shadow-sm placeholder:text-on-surface-variant/60 focus:outline-none focus:bg-surface-container-lowest transition-colors"
      />
      <button
        id="clear-btn"
        aria-label="Clear search query"
        class="absolute right-2.5 w-7 h-7 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface active:bg-surface-container"
      >
        <span class="material-symbols-outlined text-[18px]">cancel</span>
      </button>
    </div>
    <button
      id="cancel-search-btn"
      class="h-12 px-2 flex items-center justify-center font-label font-medium text-[15px] text-secondary hover:opacity-80 active:opacity-60 transition-opacity"
    >
      Cancel
    </button>
  </div>

  <!-- Recent Searches Bar -->
  <section class="mb-6 pt-1">
    <div class="flex items-center justify-between mb-2.5">
      <span class="font-label text-[12px] font-semibold tracking-wider uppercase text-on-surface-variant/80">Recent Searches</span>
      <button class="font-label text-[12px] text-on-surface-variant hover:text-on-surface transition-colors">Clear all</button>
    </div>
    <div class="flex items-center gap-2 overflow-x-auto pb-1 -mx-4 px-4 no-scrollbar">
      <!-- Active Pill -->
      <button class="flex items-center gap-1.5 h-8 pl-3 pr-2.5 rounded-full bg-secondary-fixed text-on-secondary-fixed font-label text-[12px] font-semibold shrink-0 shadow-sm transition-transform active:scale-95">
        <span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'wght' 400;">history</span>
        <span>stoic</span>
        <span class="material-symbols-outlined text-[14px] ml-0.5 opacity-70 hover:opacity-100">close</span>
      </button>

      <!-- Idle Pill 1 -->
      <button class="flex items-center gap-1.5 h-8 pl-3 pr-2.5 rounded-full bg-surface-container-lowest text-on-surface-variant font-label text-[12px] shrink-0 shadow-sm transition-colors hover:text-on-surface active:bg-surface-container">
        <span class="material-symbols-outlined text-[15px] text-on-surface-variant/70" style="font-variation-settings: 'wght' 400;">history</span>
        <span>paradigm</span>
        <span class="material-symbols-outlined text-[14px] ml-0.5 opacity-60 hover:opacity-100">close</span>
      </button>

      <!-- Idle Pill 2 -->
      <button class="flex items-center gap-1.5 h-8 pl-3 pr-2.5 rounded-full bg-surface-container-lowest text-on-surface-variant font-label text-[12px] shrink-0 shadow-sm transition-colors hover:text-on-surface active:bg-surface-container">
        <span class="material-symbols-outlined text-[15px] text-on-surface-variant/70" style="font-variation-settings: 'wght' 400;">history</span>
        <span>solitude</span>
        <span class="material-symbols-outlined text-[14px] ml-0.5 opacity-60 hover:opacity-100">close</span>
      </button>
    </div>
  </section>

  <!-- Books Result Section -->
  <section class="mb-7">
    <div class="flex items-center gap-1.5 mb-3">
      <h2 class="font-headline font-semibold text-[17px] text-on-surface tracking-tight">Books</h2>
      <span class="font-label text-[13px] text-on-surface-variant font-medium">(2)</span>
    </div>

    <div class="flex flex-col gap-2.5">
      <!-- Book Row 1 -->
      <div class="flex items-center gap-3.5 p-2.5 bg-surface-container-lowest rounded-xl shadow-sm transition-transform active:scale-[0.99] cursor-pointer">
        <div class="relative w-10 h-[60px] rounded-[3px] overflow-hidden shrink-0 shadow-sm bg-surface-container-high">
          <img
            src="placeholder"
            data-alt="Clothbound vintage book cover of Seneca's Letters From a Stoic in warm terracotta and cream paper textures with minimal classic typography, warm soft editorial studio lighting"
            class="w-full h-full object-cover"
          />
          <div class="absolute inset-y-0 left-0 w-[2px] bg-black/10"></div>
        </div>
        <div class="flex flex-col min-w-0 flex-1 justify-center">
          <h3 class="font-headline font-medium text-[16px] text-on-surface leading-snug truncate">Letters from a Stoic</h3>
          <p class="font-label text-[13px] text-on-surface-variant truncate mt-0.5">Lucius Annaeus Seneca</p>
          <div class="flex items-center gap-2 mt-1.5">
            <span class="inline-flex items-center font-label text-[11px] font-medium tracking-wide uppercase px-2 py-0.5 rounded-full bg-surface-container text-on-surface-variant">
              Philosophy • Unread
            </span>
          </div>
        </div>
        <span class="material-symbols-outlined text-on-surface-variant/50 text-[20px] pr-1">chevron_right</span>
      </div>

      <!-- Book Row 2 -->
      <div class="flex items-center gap-3.5 p-2.5 bg-surface-container-lowest rounded-xl shadow-sm transition-transform active:scale-[0.99] cursor-pointer">
        <div class="relative w-10 h-[60px] rounded-[3px] overflow-hidden shrink-0 shadow-sm bg-surface-container-high">
          <img
            src="placeholder"
            data-alt="Editorial clothbound antique cover of Marcus Aurelius Meditations, deep charcoal paper with embossed foil imprint and subtle paper deckle edges"
            class="w-full h-full object-cover"
          />
          <div class="absolute inset-y-0 left-0 w-[2px] bg-black/10"></div>
        </div>
        <div class="flex flex-col min-w-0 flex-1 justify-center">
          <h3 class="font-headline font-medium text-[16px] text-on-surface leading-snug truncate">Meditations</h3>
          <p class="font-label text-[13px] text-on-surface-variant truncate mt-0.5">Marcus Aurelius</p>
          <div class="flex items-center gap-2 mt-1.5">
            <span class="inline-flex items-center font-label text-[11px] font-medium tracking-wide uppercase px-2 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed">
              51% • Book IV
            </span>
          </div>
        </div>
        <span class="material-symbols-outlined text-on-surface-variant/50 text-[20px] pr-1">chevron_right</span>
      </div>
    </div>
  </section>

  <!-- Passages Result Section -->
  <section class="flex flex-col">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-1.5">
        <h2 class="font-headline font-semibold text-[17px] text-on-surface tracking-tight">Passages</h2>
        <span class="font-label text-[13px] text-on-surface-variant font-medium">(3)</span>
      </div>
      <button class="font-label text-[12px] text-secondary font-medium hover:underline">View in context</button>
    </div>

    <div class="flex flex-col gap-3">
      <!-- Passage 1 -->
      <article class="p-3.5 bg-surface-container-lowest rounded-xl shadow-sm transition-all active:bg-surface-container-low cursor-pointer">
        <blockquote class="font-body text-[14px] leading-relaxed text-on-surface mb-2.5">
          "For nowhere does a man retire with more quietness or freedom than into his own <mark class="bg-secondary-fixed text-on-secondary-fixed px-1 py-0.5 rounded font-semibold not-italic">stoic</mark> soul..."
        </blockquote>
        <div class="flex items-center gap-1.5 text-on-surface-variant font-label text-[12px]">
          <span class="material-symbols-outlined text-[15px] opacity-70">bookmark</span>
          <span class="font-medium text-on-surface">Meditations</span>
          <span class="opacity-40">•</span>
          <span>Book IV, p. 142</span>
        </div>
      </article>

      <!-- Passage 2 -->
      <article class="p-3.5 bg-surface-container-lowest rounded-xl shadow-sm transition-all active:bg-surface-container-low cursor-pointer">
        <blockquote class="font-body text-[14px] leading-relaxed text-on-surface mb-2.5">
          "...the true <mark class="bg-secondary-fixed text-on-secondary-fixed px-1 py-0.5 rounded font-semibold not-italic">stoic</mark> endurance requires neither anger nor despair, but a quiet reckoning with nature."
        </blockquote>
        <div class="flex items-center gap-1.5 text-on-surface-variant font-label text-[12px]">
          <span class="material-symbols-outlined text-[15px] opacity-70">bookmark</span>
          <span class="font-medium text-on-surface">Letters from a Stoic</span>
          <span class="opacity-40">•</span>
          <span>Letter XIII, p. 54</span>
        </div>
      </article>

      <!-- Passage 3 -->
      <article class="p-3.5 bg-surface-container-lowest rounded-xl shadow-sm transition-all active:bg-surface-container-low cursor-pointer">
        <blockquote class="font-body text-[14px] leading-relaxed text-on-surface mb-2.5">
          "He found in the ancient <mark class="bg-secondary-fixed text-on-secondary-fixed px-1 py-0.5 rounded font-semibold not-italic">stoic</mark> discipline a refuge from turbulent public life..."
        </blockquote>
        <div class="flex items-center gap-1.5 text-on-surface-variant font-label text-[12px]">
          <span class="material-symbols-outlined text-[15px] opacity-70">bookmark</span>
          <span class="font-medium text-on-surface">The Complete Essays</span>
          <span class="opacity-40">•</span>
          <span>Essay XX, p. 312</span>
        </div>
      </article>
    </div>
  </section>

  <!-- Editorial Search Tip Footnote -->
  <div class="flex items-center justify-center gap-2 mt-8 py-3 text-on-surface-variant/70 text-center font-label text-[12px]">
    <span class="material-symbols-outlined text-[16px]">menu_book</span>
    <span>Press return to search across notes &amp; annotations</span>
  </div>
</div>

<script>
  (function () {
    const input = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-btn');
    const cancelBtn = document.getElementById('cancel-search-btn');

    if (clearBtn && input) {
      clearBtn.addEventListener('click', function () {
        input.value = '';
        input.focus();
        clearBtn.style.display = 'none';
      });

      input.addEventListener('input', function () {
        clearBtn.style.display = input.value.length > 0 ? 'flex' : 'none';
      });
    }

    if (cancelBtn) {
      cancelBtn.addEventListener('click', function () {
        if (input) input.value = '';
        window.history.back?.();
      });
    }
  })();
</script></head><body></body></html>
